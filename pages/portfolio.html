<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Portfolio</title>
  </head>
  <body class="portfolio-page">
    <main class="portfolio">
      <header class="portfolio-header">
        <div class="avatar" aria-hidden="true">
        </div>
        <div>
          <h1 data-name>Your Name</h1>
          <span data-email>Add your email</span>
        </div>
        <nav class="portfolio-nav">
          <a href="#about">About</a>
          <a href="#education">Education</a>
          <a href="#skills">Skills</a>
          <a href="#projects">Projects</a>
          <a href="dashboard.html">Edit</a>
        </nav>
      </header>
      <section class="portfolio-section" id="about">
        <h2>About me</h2>
        <p data-about>Add your personal details from the dashboard.</p>
      </section>
      <section class="portfolio-section" id="education">
        <h2>Education</h2>
        <p data-education>No education details added yet.</p>
      </section>
      <section class="portfolio-section" id="skills">
        <h2>Skills</h2>
        <div class="chips" data-skills>
          <span class="empty">No skills added yet.</span>
        </div>
      </section>
      <section class="portfolio-section" id="projects">
        <h2>Projects</h2>
        <div data-project>
          <p class="empty">No projects added yet.</p>
        </div>
      </section>
    </main>
  </body>
</html>
