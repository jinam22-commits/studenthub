<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login</title>
  </head>
  <body class="page">
    <h1 class="page-title">LOGIN</h1>
    <form class="form auth-form" data-store="account" data-next="dashboard.html">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter password"
          required
          pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
          title="Password must be at least 8 characters, include one lowercase letter, one uppercase letter, one number, and one special character (@$!%*?&)."
        >
      </div>
      <button class="button" type="submit">Enter</button>
      <p class="form-message">
      </p>
    </form>
    <p class="auth-switch">Don’t have an account? <a href="register.html">Register here</a>
  </p>
</body>
</html>
