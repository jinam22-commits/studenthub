<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Education</title>
  </head>
  <body class="page">
    <h1 class="page-title">EDUCATION</h1>
    <form class="form" data-store="education" data-next="dashboard.html">
      <div class="field">
        <label for="college">College/School</label>
        <input id="college" name="college" placeholder="Enter college name" required>
      </div>
      <div class="field">
        <label for="degree">Degree</label>
        <input id="degree" name="degree" placeholder="Enter degree" required>
      </div>
      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" name="branch" placeholder="Enter branch" required>
      </div>
      <div class="field">
        <label for="year">Year of passing</label>
        <input id="year" name="year" type="number" placeholder="Enter year" required>
      </div>
      <div class="field">
        <label for="cgpa">CGPA</label>
        <input id="cgpa" name="cgpa" type="number" step="0.01" placeholder="Enter CGPA" required>
      </div>
      <button class="button" type="submit">Save</button>
      <p class="form-message">
      </p>
    </form>
  </body>
</html>
