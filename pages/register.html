<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../css/register.css">
    <title>Register</title>
    <script src="../js/app.js" defer></script>
  </head>
  <body class="page">
    <main class="registration-shell">
      <p class="eyebrow">Student Hub</p>
      <h1 class="page-title">CREATE YOUR ACCOUNT</h1>
      <p class="form-intro">Fields marked with <span aria-hidden="true">*</span> are required.</p>
      <form class="form registration-form" data-store="account" data-next="dashboard.html" data-validation="registration" novalidate>
      <div class="field">
        <label for="name">Full name <span aria-hidden="true">*</span></label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required minlength="2" maxlength="50" aria-describedby="name-error">
        <p class="field-error" id="name-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="email">Email address <span aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required aria-describedby="email-error">
        <p class="field-error" id="email-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="mobile">Mobile number <span aria-hidden="true">*</span></label>
        <input id="mobile" name="mobile" type="tel" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" required aria-describedby="mobile-help mobile-error">
        <small id="mobile-help">Enter a 10-digit number without spaces or symbols.</small>
        <p class="field-error" id="mobile-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required aria-describedby="password-help password-strength password-error">
        <small id="password-help">Use 8+ characters with uppercase, lowercase, number, and special character.</small>
        <div class="password-strength" id="password-strength" aria-live="polite">
          <span class="strength-meter" aria-hidden="true"><span></span></span><span class="strength-text">Password strength: not set</span>
        </div>
        <p class="field-error" id="password-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password <span aria-hidden="true">*</span></label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" required aria-describedby="confirmPassword-error">
        <p class="field-error" id="confirmPassword-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="course">Course <span aria-hidden="true">*</span></label>
        <select id="course" name="course" required aria-describedby="course-error">
          <option value="">Select your course</option>
          <option>Computer Engineering</option>
          <option>Information Technology</option>
          <option>Mechanical Engineering</option>
          <option>Electrical Engineering</option>
          <option>Other</option>
        </select>
        <p class="field-error" id="course-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="year">Year of study <span aria-hidden="true">*</span></label>
        <input id="year" name="year" type="number" min="1" max="4" step="1" placeholder="1 to 4" required aria-describedby="year-error">
        <p class="field-error" id="year-error" aria-live="polite"></p>
      </div>
      <fieldset class="field choice-field" aria-describedby="gender-error">
        <legend>Gender <span aria-hidden="true">*</span></legend>
        <div class="choice-row">
          <label><input name="gender" type="radio" value="Female" required> Female</label>
          <label><input name="gender" type="radio" value="Male"> Male</label>
          <label><input name="gender" type="radio" value="Prefer not to say"> Prefer not to say</label>
        </div>
        <p class="field-error" id="gender-error" aria-live="polite"></p>
      </fieldset>
      <div class="field terms-field">
        <label><input id="terms" name="terms" type="checkbox" required aria-describedby="terms-error"> I accept the terms and conditions <span aria-hidden="true">*</span></label>
        <p class="field-error" id="terms-error" aria-live="polite"></p>
      </div>
      <button class="button" type="submit">Register</button>
      <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </main>
</body>
</html>
