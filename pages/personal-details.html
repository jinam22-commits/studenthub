<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Personal Details</title>
  </head>
  <body class="page">
    <h1 class="page-title">PERSONAL DETAILS</h1>
    <form class="form" data-store="personal" data-next="dashboard.html">
      <div class="photo-field">Upload photo<input name="photo" type="file" accept="image/*">
    </div>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="Enter name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" placeholder="Enter phone" required>
    </div>
    <button class="button" type="submit">Save</button>
    <p class="form-message">
    </p>
  </form>
</body>
</html>
